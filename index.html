<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>md2web — Quantica Lab</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="md-styles.css" />
  <!-- Panel font options (Poppins / Lato / Raleway); Satoshi comes from colors_and_type.css -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@400;500;700&family=Raleway:wght@400;500;700&display=swap" />
  <!-- highlight.js base theme — we override all token colors in md-styles.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/grayscale-light.min.css"
        integrity="sha384-6H/VOyzdPru8fePfjI9d6g0iGg/bsIT+QXgRSRwqeWqMHEHBbvRyGRw3YUhCLnIr" crossorigin="anonymous" />

  <!-- Libraries are plain UMD scripts (no bundler/ES-module server needed), loaded from CDN
       with Subresource Integrity. Note: an internet connection is required on first load. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
          integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.5/lib/marked.umd.js"
          integrity="sha384-ZD0fTOwPMHi7zM6WTVIWJR21I07lq0ccnqz3J6WMvQKG9thh4y7TA1QE6PJu0Af8" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"
          integrity="sha384-Ic7KEGROu37YaruU6NyiYeib7UhjFyDZQ5fzBAji965L75T/4LGk5nzwMEjNGexs" crossorigin="anonymous"></script>

  <!-- Apply saved formatting before first paint so there is no flash of default styling -->
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('md2web-format') || '{}');
        var root = document.documentElement;
        ['accent', 'font', 'scale', 'leading', 'measure', 'theme'].forEach(function (key) {
          if (saved[key]) root.setAttribute('data-md-' + key, saved[key]);
        });
        if (saved.accent === 'custom' && /^#[0-9a-fA-F]{6}$/.test(saved.accentCustom || '')) {
          root.style.setProperty('--accent', saved.accentCustom);
        }
      } catch (e) { /* corrupted settings — defaults apply */ }
    })();
  </script>
</head>
<body>

  <!-- ── TOP BAR ──────────────────────────────────────────────────────── -->
  <header class="topbar">
    <a class="topbar__logo" href="#" aria-label="Quantica Lab">
      <img class="logo-light" src="assets/quantica-logo-color.png" alt="Quantica Lab" />
      <img class="logo-dark" src="assets/quantica-logo-white.png" alt="Quantica Lab" />
    </a>
    <div class="topbar__meta" id="topbar-meta">
      <span class="topbar__hint">Open a .md file to preview it</span>
    </div>
    <div class="topbar__actions">
      <button class="btn-primary" id="btn-open" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        Open .md files
      </button>
      <button class="btn-secondary" id="btn-format" type="button" aria-expanded="false" aria-controls="format-popover">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/><line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/><line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/><line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/></svg>
        Format
      </button>
      <button class="btn-secondary" id="btn-pdf" type="button" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg>
        Export PDF
      </button>

      <!-- ── FORMATTING POPOVER ─────────────────────────────────────── -->
      <div class="format-popover" id="format-popover" role="dialog" aria-label="Formatting options">
        <div class="ctl-group">
          <span class="ctl-label">Accent</span>
          <div class="swatch-row" role="group" aria-label="Accent color">
            <button class="swatch" data-format="accent" data-value="pink"     style="--sw:var(--quantica-pink)"  aria-label="Quantica pink" type="button"></button>
            <button class="swatch" data-format="accent" data-value="electric" style="--sw:var(--electric-pink)"  aria-label="Electric pink" type="button"></button>
            <button class="swatch" data-format="accent" data-value="violet"   style="--sw:var(--violet-primary)" aria-label="Violet"        type="button"></button>
            <button class="swatch" data-format="accent" data-value="indigo"   style="--sw:var(--indigo)"         aria-label="Indigo"        type="button"></button>
            <button class="swatch" data-format="accent" data-value="emerald"  style="--sw:var(--status-success)" aria-label="Emerald"       type="button"></button>
            <button class="swatch" data-format="accent" data-value="ink"      style="--sw:var(--ink)"            aria-label="Ink"           type="button"></button>
            <button class="swatch swatch--mixer" id="btn-mixer" aria-label="Custom accent color" title="Color mixer" type="button"></button>
            <input type="color" id="mixer-input" class="mixer-input" value="#C41E54" tabindex="-1" aria-hidden="true" />
          </div>
        </div>

        <div class="ctl-group">
          <span class="ctl-label">Font</span>
          <div class="font-grid" role="group" aria-label="Article font">
            <button class="font-opt font-opt--satoshi" data-format="font" data-value="satoshi" type="button">Satoshi</button>
            <button class="font-opt font-opt--poppins" data-format="font" data-value="poppins" type="button">Poppins</button>
            <button class="font-opt font-opt--lato"    data-format="font" data-value="lato"    type="button">Lato</button>
            <button class="font-opt font-opt--raleway" data-format="font" data-value="raleway" type="button">Raleway</button>
          </div>
        </div>

        <div class="ctl-row">
          <div class="ctl-group">
            <span class="ctl-label">Size</span>
            <div class="seg" role="group" aria-label="Text size">
              <button class="seg__btn" data-format="scale" data-value="sm" type="button">S</button>
              <button class="seg__btn" data-format="scale" data-value="md" type="button">M</button>
              <button class="seg__btn" data-format="scale" data-value="lg" type="button">L</button>
            </div>
          </div>
          <div class="ctl-group">
            <span class="ctl-label">Spacing</span>
            <div class="seg" role="group" aria-label="Line spacing">
              <button class="seg__btn" data-format="leading" data-value="compact" type="button">Tight</button>
              <button class="seg__btn" data-format="leading" data-value="normal"  type="button">Normal</button>
              <button class="seg__btn" data-format="leading" data-value="relaxed" type="button">Loose</button>
            </div>
          </div>
        </div>

        <div class="ctl-group">
          <span class="ctl-label">Measure</span>
          <div class="seg" role="group" aria-label="Content width">
            <button class="seg__btn" data-format="measure" data-value="narrow"  type="button">Narrow</button>
            <button class="seg__btn" data-format="measure" data-value="default" type="button">Default</button>
            <button class="seg__btn" data-format="measure" data-value="wide"    type="button">Wide</button>
          </div>
        </div>

        <div class="ctl-group">
          <span class="ctl-label">Theme</span>
          <div class="seg" role="group" aria-label="Reading theme">
            <button class="seg__btn" data-format="theme" data-value="light" type="button">Light</button>
            <button class="seg__btn" data-format="theme" data-value="sepia" type="button">Sepia</button>
            <button class="seg__btn" data-format="theme" data-value="dark"  type="button">Dark</button>
          </div>
        </div>

        <div class="format-popover__footer">
          <span class="format-popover__note type-mono">Applies to the article only</span>
          <button class="format-popover__reset" id="btn-format-reset" type="button">Reset</button>
        </div>
      </div>
    </div>
  </header>

  <!-- hidden file input -->
  <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple style="display:none" />

  <!-- drop overlay -->
  <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
    <div class="drop-overlay__inner">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Drop Markdown files here</span>
    </div>
  </div>

  <!-- main layout -->
  <div class="layout" id="layout">

    <aside class="sidebar" id="sidebar" hidden>
      <nav class="files" id="files" aria-label="Open files" hidden>
        <div class="sidebar__label type-eyebrow">Files</div>
        <ul class="files__list" id="file-list"></ul>
      </nav>
      <nav class="toc" id="toc" aria-label="Table of contents" hidden>
        <div class="sidebar__label type-eyebrow">Contents</div>
        <ol class="toc__list" id="toc-list"></ol>
      </nav>
      <div class="sidebar__resizer" id="sidebar-resizer" role="separator"
           aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"
           title="Drag to resize · double-click to reset"></div>
    </aside>

    <main class="main-area" id="main-area">
      <div class="dropzone" id="dropzone">
        <div class="dropzone__q">
          <img src="assets/quantica-q-mark-pink.png" alt="" aria-hidden="true" />
        </div>
        <p class="dropzone__headline type-h2">Open a Markdown file.</p>
        <div class="dropzone__cta">
          <button class="btn-primary btn-primary--lg" id="btn-open-drop" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
            Choose .md files
          </button>
        </div>
        <p class="dropzone__hint type-caption">Or drag and drop one or more .md files anywhere on this page.</p>
      </div>
    </main>

    <article class="article" id="article" hidden>
      <!-- Per-page printable wrapper: the table's <thead> is repeated on every
           printed page by Chrome (display: table-header-group). On screen the
           table-related elements collapse to a plain block layout via display:contents. -->
      <table class="print-paged" role="presentation">
        <thead>
          <tr><td class="print-paged__top">
            <div class="print-paged__logo" aria-hidden="true">
              <img src="assets/quantica-logo-color.png" alt="" />
            </div>
          </td></tr>
        </thead>
        <tbody>
          <tr><td class="print-paged__main">
            <div id="article-header"></div>
            <div class="article__body" id="article-body"></div>
          </td></tr>
        </tbody>
        <tfoot>
          <tr><td class="print-paged__bottom" aria-hidden="true"></td></tr>
        </tfoot>
      </table>
    </article>

  </div>

  <footer class="site-footer" id="site-footer" hidden>
    <div class="site-footer__bar"></div>
    <div class="site-footer__inner">
      <img class="logo-light site-footer__logo" src="assets/quantica-logo-color.png" alt="Quantica Lab" />
      <img class="logo-dark site-footer__logo" src="assets/quantica-logo-white.png" alt="Quantica Lab" />
      <span class="type-mono">md2web · rendered with the Quantica design system</span>
    </div>
  </footer>

  <!-- screen-reader announcements (file loaded, formatting changed) -->
  <span id="sr-live" class="sr-only" aria-live="polite"></span>

  <script src="app.js"></script>
</body>
</html>
